name: Test and publish Chordroom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chordroom-pages
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.cloud.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
      CHORDROOM_ACCESS_CODE: ${{ secrets.CHORDROOM_ACCESS_CODE }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy private API only if all four secrets are configured
        id: cloud
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.PARSE_API_KEY != '' && env.CHORDROOM_ACCESS_CODE != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            PARSE_API_KEY
            CHORDROOM_ACCESS_CODE
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          CHORDROOM_ACCESS_CODE: ${{ secrets.CHORDROOM_ACCESS_CODE }}

  pages:
    needs: worker
    if: always() && needs.worker.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run music and protected API contract tests
        run: |
          node test/test.mjs
          node test/server-smoke.mjs
          node --test worker/test/worker.test.mjs
      - uses: actions/configure-pages@v5
      - name: Configure API URL (no secret is written to the website)
        env:
          WORKER_URL: ${{ needs.worker.outputs.url }}
        run: |
          node -e "const fs=require('node:fs');let u=process.env.WORKER_URL||'';try{const x=new URL(u);if(x.protocol!=='https:')u='';else u=x.origin;}catch{u='';}fs.writeFileSync('public/api-config.js','window.CHORDROOM_API_BASE = '+JSON.stringify(u)+';\n');"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
