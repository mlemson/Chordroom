name: Chordroom CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app.js && node --check worker/src/index.js
      - run: node test/test.mjs
      - run: node test/server-smoke.mjs
      - run: node --test worker/test/worker.test.mjs
